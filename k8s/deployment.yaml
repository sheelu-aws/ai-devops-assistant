
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-devops-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-devops-assistant
  template:
    metadata:
      labels:
        app: ai-devops-assistant
    spec:
      containers:
        - name: ai-devops-assistant
          image: ai-devops-assistant:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              
          envFrom:
            - configMapRef:
                name: ai-devops-config
          env:
            - name: DEMO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-devops-secret
                  key: DEMO_API_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
      
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
